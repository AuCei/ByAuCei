<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark light"/>
<meta name="description" content="CNAuCei 的留言板，写下一句话，留下一点回声。"/>
<title>留言板 · 阿张的小破站</title>
<link href="https://dlink.host/1drv/aHR0cHM6Ly8xZHJ2Lm1zL2kvYy9jY2U2ZTdkODY5ZWM3MDVkL0lRQWVFLTluS0l1alQ2SVgtbHFqYWNjTEFWMDhtdFQycDNPTGkxeWlmZUpsMTNFP2U9V1BVWVVV.png" rel="icon" type="image/png"/>
<link href="guestbook.css?v=20260821-owner-fix" rel="stylesheet"/>
</head>
<body>
<div aria-hidden="true" class="page-background__grid"></div>
<div aria-hidden="true" class="ambient ambient--one"></div>
<div aria-hidden="true" class="ambient ambient--two"></div>
<div class="page-shell" id="pageContent">
<main class="guestbook-shell">
<header class="topbar">
<a class="back-link" href="../" aria-label="返回个人主页">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
<span>返回主页</span>
</a>
<div class="topbar__right">
<span class="page-chip"><i aria-hidden="true"></i>GUESTBOOK</span>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到浅色主题" aria-pressed="false">
<span class="theme-toggle__sun" aria-hidden="true">☀</span><span class="theme-toggle__moon" aria-hidden="true">☾</span>
</button>
</div>
</header>

<section class="hero">
<p class="eyebrow">写下一句话，留下一点回声</p>
<h1>留言板<span class="hero__dot">.</span></h1>
<p>路过这里的话，不妨留下此刻的想法。留言将安全保存到云端，所有访客都能看到彼此留下的回声。</p>
<div class="hero__stats" aria-label="留言统计">
<div><strong id="messageCount">0</strong><span>条留言</span></div>
<div><strong id="likeCount">0</strong><span>次点赞</span></div>
</div>
</section>

<section class="composer" aria-labelledby="composerTitle">
<div class="section-heading">
<div><span class="section-heading__index">01</span><h2 id="composerTitle">留下留言</h2></div>
<span class="privacy-tag" id="connectionStatus">正在连接云端</span>
</div>
<form id="messageForm" novalidate>
<div class="form-grid">
<label class="field"><span>你的昵称</span><input id="nickname" name="nickname" maxlength="16" autocomplete="nickname" placeholder="怎么称呼你？" required/></label>
<label class="field"><span>心情</span><select id="mood" name="mood"><option value="✨">✨ 开心</option><option value="🌙">🌙 平静</option><option value="🌱">🌱 期待</option><option value="☕">☕ 随意</option><option value="🎮">🎮 游戏中</option></select></label>
</div>
<label class="field field--message"><span>留言内容</span><textarea id="message" name="message" maxlength="280" rows="5" placeholder="想说点什么……" required></textarea><small><span id="charCount">0</span>/280</small></label>
<div class="form-actions">
<label class="remember"><input id="rememberName" type="checkbox" checked/><span>记住昵称</span></label>
<button class="submit-button" type="submit"><span>发布留言</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-5-7-2Z"></path><path d="m12 14 3-3"></path></svg></button>
</div>
</form>
</section>

<section class="messages-section" aria-labelledby="messagesTitle">
<div class="section-heading section-heading--messages">
<div><span class="section-heading__index">02</span><h2 id="messagesTitle">最近留言</h2></div>
<div class="tools">
<label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><input id="searchInput" type="search" placeholder="搜索留言" aria-label="搜索留言"/></label>
<select id="sortSelect" aria-label="留言排序"><option value="newest">最新优先</option><option value="oldest">最早优先</option><option value="likes">点赞最多</option></select>
</div>
</div>
<div class="message-list" id="messageList"></div>
<div class="empty-state" id="emptyState" hidden><div aria-hidden="true">✦</div><h3>这里还很安静</h3><p>成为第一个留下脚印的人吧。</p></div>
</section>

<footer><span>© 2024-<span id="currentYear"></span> ByAuCei</span><span>愿每一句话，都被温柔看见</span></footer>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="guestbook-config.js?v=20260821-owner-fix"></script>
<script src="guestbook.js?v=20260821-owner-fix"></script>
</body>
</html>
