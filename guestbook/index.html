<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="color-scheme" content="dark light"/>
<meta name="description" content="CNAuCei 的留言板，写下一句话，留下一点回声。"/>
<title>留言板 · 阿张的小破站</title>
<link href="https://dlink.host/1drv/aHR0cHM6Ly8xZHJ2Lm1zL2kvYy9jY2U2ZTdkODY5ZWM3MDVkL0lRQWVFLTluS0l1alQ2SVgtbHFqYWNjTEFWMDhtdFQycDNPTGkxeWlmZUpsMTNFP2U9V1BVWVVV.png" rel="icon" type="image/png"/>
<link href="guestbook.css?v=20260823-browser-gps" rel="stylesheet"/>
</head>
<body>
<div aria-hidden="true" class="page-background__grid"></div>
<div aria-hidden="true" class="ambient ambient--one"></div>
<div aria-hidden="true" class="ambient ambient--two"></div>
<div class="page-shell" id="pageContent">
<main class="guestbook-shell">
<header class="topbar">
<a class="back-link" href="../" aria-label="返回个人主页">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
<span>返回主页</span>
</a>
<div class="topbar__right">
<span class="page-chip"><i aria-hidden="true"></i>GUESTBOOK</span>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到浅色主题" aria-pressed="false">
<span aria-hidden="true" class="theme-toggle__icon theme-toggle__icon--sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path></svg></span>
<span aria-hidden="true" class="theme-toggle__icon theme-toggle__icon--moon"><svg viewBox="0 0 24 24"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"></path></svg></span>
</button>
</div>
</header>

<section class="hero">
<p class="eyebrow">写下一句话，留下一点回声</p>
<h1>留言板<span class="hero__dot">.</span></h1>
<p>路过这里的话，不妨留下此刻的想法。留言将安全保存到云端，所有访客都能看到彼此留下的回声。</p>
<div class="hero__stats is-loading" id="heroStats" aria-label="留言统计" aria-busy="true">
<div><strong id="messageCount">0</strong><span>条留言</span></div>
<div><strong id="likeCount">0</strong><span>次点赞</span></div>
</div>
</section>

<section class="composer" aria-labelledby="composerTitle">
<div class="section-heading">
<div><span class="section-heading__index">01</span><h2 id="composerTitle">留下留言</h2></div>
<button class="connection-status is-connecting" id="connectionStatus" type="button" aria-label="正在连接"><i aria-hidden="true"></i><span>正在连接</span></button>
</div>
<form id="messageForm" novalidate>
<div class="form-grid form-grid--stacked">
<label class="field"><span>你的昵称</span><input id="nickname" name="nickname" maxlength="16" autocomplete="nickname" placeholder="怎么称呼你？" required/></label>
<fieldset class="field mood-field"><div class="mood-heading"><legend>心情</legend><span class="mood-current">当前：<strong id="moodCurrent">开心</strong></span></div><input id="mood" name="mood" type="hidden" value="✨"/><div class="mood-picker" role="radiogroup" aria-label="选择心情"><button class="mood-option is-selected" type="button" data-mood="✨" data-label="开心" role="radio" aria-label="开心" aria-checked="true" title="开心"><span>✨</span></button><button class="mood-option" type="button" data-mood="🌙" data-label="平静" role="radio" aria-label="平静" aria-checked="false" title="平静"><span>🌙</span></button><button class="mood-option" type="button" data-mood="🌱" data-label="期待" role="radio" aria-label="期待" aria-checked="false" title="期待"><span>🌱</span></button><button class="mood-option" type="button" data-mood="☕" data-label="随意" role="radio" aria-label="随意" aria-checked="false" title="随意"><span>☕</span></button><button class="mood-option" type="button" data-mood="🎮" data-label="游戏中" role="radio" aria-label="游戏中" aria-checked="false" title="游戏中"><span>🎮</span></button></div></fieldset>
</div>
<label class="field field--message"><span>留言内容</span><textarea id="message" name="message" maxlength="280" rows="5" placeholder="想说点什么……" required></textarea><small class="char-counter" id="charCounter"><span id="charCount">0</span>/280</small></label>
<div class="form-actions">
<label class="remember"><input id="rememberName" type="checkbox" checked/><span>记住昵称</span></label>
<button class="submit-button" id="submitButton" type="submit"><span class="submit-button__content"><span class="submit-button__label">发布留言</span><span class="submit-button__spinner" aria-hidden="true"></span><svg class="submit-button__icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></span></button>
</div>
</form>
</section>

<section class="messages-section" aria-labelledby="messagesTitle">
<div class="section-heading section-heading--messages">
<div><span class="section-heading__index">02</span><h2 id="messagesTitle">最近留言</h2></div>
<div class="tools">
<label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><input id="searchInput" type="search" placeholder="搜索留言" aria-label="搜索留言"/><button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" hidden>×</button></label>
<select id="sortSelect" aria-label="留言排序"><option value="newest">最新优先</option><option value="oldest">最早优先</option><option value="likes">点赞最多</option></select>
</div>
</div>
<div class="message-list is-loading" id="messageList" aria-busy="true"></div>
<div class="empty-state" id="emptyState" hidden><div aria-hidden="true">✦</div><h3 id="emptyTitle">这里还很安静</h3><p id="emptyText">成为第一个留下脚印的人吧。</p><button class="empty-action" id="emptyAction" type="button" hidden>清除搜索</button></div>
<nav class="pagination" id="pagination" aria-label="留言分页" hidden>
<button class="pagination__button" id="prevPage" type="button" aria-label="上一页">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg><span>上一页</span>
</button>
<div class="pagination__pages" id="paginationPages" aria-live="polite"></div>
<button class="pagination__button" id="nextPage" type="button" aria-label="下一页">
<span>下一页</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</nav>
</section>

<footer><span>© 2024-<span id="currentYear"></span> ByAuCei</span><span>愿每一句话，都被温柔看见</span></footer>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="confirm-modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalText" hidden>
<div class="confirm-modal__backdrop" data-close-modal></div>
<div class="confirm-modal__panel" tabindex="-1">
<div class="confirm-modal__icon" aria-hidden="true">!</div>
<h2 id="deleteModalTitle">删除这条留言？</h2>
<p id="deleteModalText">删除后无法恢复，请确认是否继续。</p>
<div class="confirm-modal__actions"><button class="modal-button modal-button--cancel" id="cancelDelete" type="button">取消</button><button class="modal-button modal-button--danger" id="confirmDelete" type="button">确认删除</button></div>
</div>
</div>
<script src="guestbook-config.js?v=20260823-browser-gps"></script>
<script src="guestbook.js?v=20260823-browser-gps"></script>
</body>
</html>
