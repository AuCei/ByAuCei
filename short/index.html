<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="AuCei 短链接生成器">
  <title>短链接生成器 | AuCei</title>
  <link rel="stylesheet" href="style.css?v=20260811">
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <a class="back-link" href="/" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        返回主页
      </a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"></path></svg>
      </button>
    </header>

    <section class="hero">
      <span class="eyebrow"><i></i> AUCEI SHORT LINK</span>
      <h1>让链接更短，<span>分享更简单</span></h1>
      <p>输入长链接并设置可选短码，生成专属于 <strong>s.aucei.cn</strong> 的短链接。</p>
    </section>

    <section class="card" aria-labelledby="generatorTitle">
      <div class="card-heading">
        <div>
          <h2 id="generatorTitle">创建短链接</h2>
          <p>仅管理员可创建，管理密钥不会写入网站源码。</p>
        </div>
        <span class="status" id="serviceStatus"><i></i><span>检查服务</span></span>
      </div>

      <form id="shortForm" novalidate>
        <div class="field">
          <label for="longUrl">原始链接</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path></svg>
            <input id="longUrl" name="longUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/a/very/long/link" maxlength="4096" required>
          </div>
        </div>

        <div class="field">
          <div class="label-row"><label for="customCode">自定义短码</label><span>可选，3 至 32 位</span></div>
          <div class="code-wrap">
            <span>https://s.aucei.cn/</span>
            <input id="customCode" name="customCode" type="text" autocomplete="off" placeholder="my-link" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}">
          </div>
          <p class="hint">仅支持字母、数字、下划线和连字符。不填写则自动生成。</p>
        </div>

        <div class="field">
          <label for="adminToken">管理密钥</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <input id="adminToken" name="adminToken" type="password" autocomplete="current-password" placeholder="输入 Cloudflare ADMIN_TOKEN" required>
            <button class="reveal" id="revealToken" type="button" aria-label="显示管理密钥">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <label class="remember"><input id="rememberToken" type="checkbox"><span>在当前浏览器会话中记住密钥，关闭标签页后清除</span></label>
        </div>

        <p class="message" id="formMessage" role="alert" aria-live="polite"></p>

        <button class="submit" id="submitButton" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path></svg>
          <span>生成短链接</span>
        </button>
      </form>
    </section>

    <section class="result" id="resultPanel" hidden aria-live="polite">
      <div class="result-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></div>
      <div class="result-copy">
        <span>短链接已生成</span>
        <a id="shortLink" href="#" target="_blank" rel="noopener noreferrer"></a>
        <small id="originalLink"></small>
      </div>
      <button class="copy" id="copyLink" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
        <span>复制</span>
      </button>
    </section>

    <section class="security-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.9 8.3 7 10 4.1-1.7 7-5.4 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
      <div><strong>安全提示</strong><p>请勿在公共设备上记住管理密钥。密钥仅发送给 Cloudflare Worker 验证，不会包含在网页源码中。</p></div>
    </section>

    <footer>© <span id="year"></span> ByAuCei · Short Link Service</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js?v=20260811"></script>
</body>
</html>
